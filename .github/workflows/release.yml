name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Validate Nix flake
        run: nix flake check --no-update-lock-file

      - name: Restore release keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          test -n "$SIGNING_KEY_BASE64"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"

      - name: Test, lint, and build signed APK in the Nix environment
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: nix develop --no-update-lock-file --command scripts/check

      - name: Verify release identity and compatibility
        env:
          EXPECTED_SIGNER_SHA256: 7d84a993db77ef47bbee7241808f15901a4d482a230ac4c71d99c2cf519c48df
        run: nix develop --no-update-lock-file --command scripts/verify-release-apk "$GITHUB_REF_NAME" "$EXPECTED_SIGNER_SHA256"

      - name: Prepare release artifacts
        run: |
          cp app/build/outputs/apk/release/app-release.apk glass-pb-scoreboard.apk
          sha256sum glass-pb-scoreboard.apk > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" glass-pb-scoreboard.apk SHA256SUMS --clobber
          else
            gh release create "$TAG" glass-pb-scoreboard.apk SHA256SUMS \
              --title "Glass Pickleball Scoreboard $TAG" \
              --generate-notes \
              --verify-tag
          fi
